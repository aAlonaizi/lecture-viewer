<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جمعية الأسبوع</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8FC; --sheet:#FFFFFF; --ink:#26358A; --ink-soft:#5B67A8;
  --rule:#DCE1F2; --margin:#E6A3B4; --done:#9AA1BE; --star:#C2410C;
  --flag-bg:#FFF4E0; --flag:#8A5A00; --claim-bg:#E8ECFB; --live:#1F8A4C;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10131F; --sheet:#171B2B; --ink:#C9D1FF; --ink-soft:#8F99CF;
    --rule:#262C45; --margin:#7A3F52; --done:#5A6080; --star:#FB923C;
    --flag-bg:#33280F; --flag:#F3C66B; --claim-bg:#232A47; --live:#4ADE80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10131F; --sheet:#171B2B; --ink:#C9D1FF; --ink-soft:#8F99CF;
  --rule:#262C45; --margin:#7A3F52; --done:#5A6080; --star:#FB923C;
  --flag-bg:#33280F; --flag:#F3C66B; --claim-bg:#232A47; --live:#4ADE80;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Readex Pro",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--paper);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;border-bottom:2px solid var(--margin)}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:25px;font-weight:700}
.count{font-size:15px;color:var(--ink-soft);white-space:nowrap}
.count b{font-size:22px;color:var(--ink)}
.bar{margin-top:10px;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.me{font:inherit;font-size:14px;border:1.5px solid var(--ink-soft);background:transparent;color:var(--ink);
  padding:6px 12px;border-radius:999px;cursor:pointer}
.tools button{font:inherit;font-size:14px;border:1.5px solid var(--ink-soft);background:transparent;color:var(--ink);
  padding:6px 12px;border-radius:999px;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.status{margin-inline-start:auto;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--done)}
.status.live::before{background:var(--live)}
main{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.meals{background:var(--sheet);border-radius:6px;padding:10px 16px;font-size:15px;color:var(--ink-soft);margin-top:4px}
.meals b{color:var(--ink);font-weight:500}
section{background:var(--sheet);margin:14px 0;border-radius:6px;border-inline-start:3px solid var(--margin);overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
h2{margin:0;font-size:18px;font-weight:700;flex:1}
.sc{font-size:14px;color:var(--ink-soft)}
.claim{font:inherit;font-size:13px;border:1.5px dashed var(--ink-soft);background:transparent;color:var(--ink-soft);
  padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.claim.taken{border-style:solid;border-color:transparent;background:var(--claim-bg);color:var(--ink);font-weight:500}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--rule)}
label{display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:54px;cursor:pointer;-webkit-tap-highlight-color:transparent}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border:2px solid var(--ink-soft);border-radius:5px;
  margin:0;display:grid;place-items:center;cursor:pointer;background:transparent}
input[type=checkbox]::after{content:"";width:12px;height:7px;border:solid var(--sheet);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
input[type=checkbox]:checked::after{opacity:1}
input:focus-visible,button:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
.txt{flex:1}
.name{background-image:linear-gradient(var(--ink),var(--ink));background-repeat:no-repeat;
  background-position:100% 55%;background-size:0 2px;transition:background-size .2s,color .2s}
li.on .name{background-size:100% 2px;color:var(--done)}
.note{display:block;font-size:13px;color:var(--ink-soft)}
.by{display:block;font-size:12px;color:var(--live)}
.star{color:var(--star);font-size:13px;margin-inline-start:6px}
li{position:relative}
li label{padding-bottom:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding-block:0 10px;padding-inline:56px 16px}
.chip{font:inherit;font-size:12.5px;border:1.5px dashed var(--rule);background:transparent;color:var(--ink-soft);
  padding:3px 10px;border-radius:999px;cursor:pointer;min-height:30px}
.chip.taken{border-style:solid;border-color:transparent;background:var(--claim-bg);color:var(--ink);font-weight:500}
.chip.inherit{border-style:solid;border-color:var(--rule);color:var(--ink-soft)}
.chip.hasnote{border-style:solid;border-color:transparent;background:var(--flag-bg);color:var(--flag);font-weight:500}
li.on .acts .chip{opacity:.6}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.presets button{flex:none;font-size:14px;padding:6px 12px;border-radius:999px;background:transparent;color:var(--ink);border:1.5px solid var(--ink-soft)}
.flag{display:inline-block;font-size:12px;background:var(--flag-bg);color:var(--flag);border-radius:4px;padding:1px 7px;margin-top:3px}
.pulse{animation:pulse .9s ease-out}
@keyframes pulse{from{background:var(--claim-bg)}to{background:transparent}}
body.hide li.on{display:none}
body.hide section.all-done{display:none}
.finish{display:none;text-align:center;padding:40px 16px;font-size:20px}
body.complete .finish{display:block}
dialog{border:none;border-radius:10px;background:var(--sheet);color:var(--ink);padding:20px;width:min(92vw,360px)}
dialog::backdrop{background:rgba(10,15,40,.45)}
dialog h3{margin:0 0 10px;font-size:18px}
dialog input{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--ink-soft);border-radius:8px;background:var(--paper);color:var(--ink)}
dialog .act{display:flex;gap:8px;margin-top:14px}
dialog button{font:inherit;flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--ink);cursor:pointer;background:var(--ink);color:var(--sheet)}
dialog button.ghost{background:transparent;color:var(--ink)}
.more{font:inherit;font-size:18px;line-height:1;border:none;background:transparent;color:var(--ink-soft);padding:4px 8px;cursor:pointer;border-radius:6px}
.where{padding:0 16px 8px;font-size:14px;color:var(--ink-soft);cursor:pointer}
.additem{display:block;width:100%;font:inherit;font-size:14px;text-align:start;border:none;border-top:1px solid var(--rule);background:transparent;color:var(--ink-soft);padding:12px 16px;cursor:pointer}
.addsec{display:block;width:100%;font:inherit;font-size:15px;border:1.5px dashed var(--ink-soft);background:transparent;color:var(--ink);padding:12px;border-radius:6px;cursor:pointer;margin-top:6px}
body.hide .additem{display:none}
dialog .fl{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 4px}
dialog select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--ink-soft);border-radius:8px;background:var(--paper);color:var(--ink)}
dialog button.danger{color:#B42318;border-color:#B42318}
dialog [hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>جمعية الأسبوع</h1>
      <div class="count"><b id="left">0</b> باقي من <span id="total">0</span></div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="row tools">
      <button class="me" id="meBtn">اكتبي اسمك</button>
      <button id="hideBtn" aria-pressed="false">إخفاء اللي انشال</button>
      <span class="status" id="status">جاري الاتصال…</span>
    </div>
  </div>
</header>
<main>
  <div class="meals">عشاء الأسبوع: <b>برجر، سلمون، ناندوز، رز مقلي، تاكو برجر</b> — الأغراض اللي عليها ★ لهالوجبات.</div>
  <div id="list"></div>
  <button type="button" class="addsec" id="addSecBtn">+ قسم جديد</button>
  <div class="finish">✔ خلصت القائمة كلها</div>
</main>

<dialog id="nameDlg">
  <h3>منو اللي يتسوق؟</h3>
  <input id="nameIn" maxlength="20" placeholder="الاسم" autocomplete="off">
  <div class="act"><button id="nameOk">حفظ</button><button class="ghost" id="nameCancel">إلغاء</button></div>
</dialog>

<dialog id="noteDlg">
  <h3 id="noteTitle">ملاحظة</h3>
  <div class="presets"><button type="button">غير متوفر</button><button type="button">غالي</button><button type="button">نشتريه من مكان ثاني</button><button type="button">خذينا البديل</button><button type="button">نجيبه الأسبوع الجاي</button></div>
  <input id="noteIn" maxlength="60" placeholder="أو اكتب ملاحظتك" autocomplete="off">
  <div class="act"><button id="noteOk">حفظ</button><button class="ghost" id="noteClear">مسح</button><button class="ghost" id="noteCancel">إلغاء</button></div>
</dialog>

<dialog id="itemDlg">
  <h3 id="itemTitle">غرض</h3>
  <label class="fl" for="itemName">الاسم</label>
  <input id="itemName" maxlength="40" autocomplete="off">
  <label class="fl" for="itemSec">القسم</label>
  <select id="itemSec"></select>
  <div class="act"><button id="itemOk">حفظ</button><button class="ghost danger" id="itemDel">حذف</button><button class="ghost" id="itemCancel">إلغاء</button></div>
</dialog>

<dialog id="secDlg">
  <h3 id="secTitle">قسم</h3>
  <label class="fl" for="secName">اسم القسم</label>
  <input id="secName" maxlength="30" autocomplete="off">
  <label class="fl" for="secNote">وين نلقاه؟</label>
  <input id="secNote" maxlength="60" placeholder="مثال: الممر ٧ جنب المخبز" autocomplete="off">
  <div class="act" id="secMoveRow"><button class="ghost" id="secUp">⬆ فوق</button><button class="ghost" id="secDown">⬇ تحت</button></div>
  <div class="act"><button id="secOk">حفظ</button><button class="ghost" id="secCancel">إلغاء</button></div>
</dialog>

<script>
/* ---------- base list ---------- */
const BASE_DATA = [
  {k:"veg", t:"🥬 خضار وفواكه", items:[
    {k:"potato", n:"بطاطس", s:1},
    {k:"lemon", n:"ليمون / لومي أخضر", d:"للسلمون", s:1},
    {k:"gonion", n:"بصل أخضر", d:"للرز المقلي", s:1},
    {k:"lettuce", n:"خس", d:"للبرجر والتاكو", s:1},
    {k:"straw", n:"فراولة"},
    {k:"grapes", n:"عنب"},
    {k:"fruits", n:"فواكه ثانية", d:"حسب الموجود"}
  ]},
  {k:"meat", t:"🍗 لحوم وأسماك", items:[
    {k:"chicken", n:"دجاج", d:"لعشاء ناندوز", s:1},
    {k:"breast", n:"صدر دجاج", s:1},
    {k:"salmon", n:"سلمون", s:1},
    {k:"mince", n:"لحم مفروم", d:"لتاكو البرجر", s:1}
  ]},
  {k:"dairy", t:"🥚 ألبان وبيض", items:[
    {k:"eggs", n:"بيض", d:"للرز المقلي", s:1},
    {k:"cheese", n:"جبن", d:"للبرجر", s:1},
    {k:"yogurt", n:"زبادي سادة"},
    {k:"labneh", n:"لبنة"},
    {k:"cream", n:"كريمة طبخ"}
  ]},
  {k:"bread", t:"🍞 مخبوزات", items:[
    {k:"buns", n:"خبز برجر", s:1},
    {k:"tortilla", n:"تورتيلا بيضا", d:"للتاكو", s:1},
    {k:"toast", n:"توست"}
  ]},
  {k:"pantry", t:"🫙 بقالة", items:[
    {k:"rice", n:"رز", s:1},
    {k:"oil", n:"زيت نباتي"},
    {k:"tuna", n:"تونة"},
    {k:"corn", n:"ذرة"},
    {k:"sauce", n:"خردل وكاتشب", s:1},
    {k:"zaatar", n:"زعتر"},
    {k:"vinegar", n:"خل"},
    {k:"flakes", n:"كورن فليكس شوكولاتة", d:"النوع المدوّر"},
    {k:"chips", n:"شيبس"},
    {k:"juice", n:"عصير"}
  ]},
  {k:"care", t:"🧴 عناية شخصية", items:[
    {k:"deo", n:"مزيل عرق", d:"لفاطمة"}
  ]},
  {k:"home", t:"🧽 أغراض البيت", items:[
    {k:"tissue", n:"كلينكس وورق تواليت"},
    {k:"sandbag", n:"أكياس ساندويتش"},
    {k:"lint", n:"رولة لاصقة للملابس", d:"لإزالة الوبر"},
    {k:"pan", n:"مقلاة"},
    {k:"iron", n:"مكواة يدوية", d:"المكواة بس، مو الطقم كامل", f:"تأكد من النوع مع البنات"}
  ]}
];

/* ---------- state ---------- */
let sections, items, order;      // structure
let checks, claims, itemClaims, notes, secNotes;
function resetState(){
  sections = {}; items = {}; order = [];
  BASE_DATA.forEach((sec, si)=>{
    sections[sec.k] = {t: sec.t};
    order.push(sec.k);
    sec.items.forEach((it, ii)=>{
      items[sec.k + "-" + it.k] = {n: it.n, d: it.d||"", s: it.s||0, f: it.f||"", sec: sec.k, pos: si*1000 + ii};
    });
  });
  checks = {}; claims = {}; itemClaims = {}; notes = {}; secNotes = {};
}
resetState();
let myName = "";
try{ myName = localStorage.getItem("jamiya-name") || ""; }catch(e){}
const TOPIC = "jamiya-22048e44180c034c";
const BASE = "https://ntfy.sh/" + TOPIC;
const LOCAL = "jamiya-week-cache-v2";
const S = (v, n)=> String(v ?? "").slice(0, n);
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
let posSeq = 1e6;

/* ---------- events ---------- */
function apply(ev){
  if(!ev || typeof ev !== "object") return;
  switch(ev.t){
    case "c": if(items[ev.id]) checks[ev.id] = {done: !!ev.d, by: S(ev.by,20)}; break;
    case "a": if(sections[ev.k]) claims[ev.k] = {name: S(ev.name,20)}; break;
    case "i": if(items[ev.id]) itemClaims[ev.id] = {name: S(ev.name,20)}; break;
    case "n": if(items[ev.id]) notes[ev.id] = {note: S(ev.note,60), by: S(ev.by,20)}; break;
    case "sec+":
      if(ev.k && !sections[ev.k]){ sections[ev.k] = {t: S(ev.title,30) || "قسم"}; order.push(ev.k); }
      break;
    case "secr": if(sections[ev.k]) sections[ev.k].t = S(ev.title,30) || sections[ev.k].t; break;
    case "sn": if(sections[ev.k]) secNotes[ev.k] = {note: S(ev.note,60), by: S(ev.by,20)}; break;
    case "ord":
      if(Array.isArray(ev.order)){
        const known = ev.order.filter(k=>sections[k]);
        order = known.concat(order.filter(k=>!known.includes(k)));
      }
      break;
    case "item+":
      if(ev.id && !items[ev.id] && sections[ev.sec]) items[ev.id] = {n: S(ev.n,40) || "غرض", d:"", s:0, f:"", sec: ev.sec, pos: ++posSeq, by: S(ev.by,20)};
      break;
    case "itemr": if(items[ev.id] && S(ev.n,40)) items[ev.id].n = S(ev.n,40); break;
    case "mv": if(items[ev.id] && sections[ev.sec] && items[ev.id].sec !== ev.sec){ items[ev.id].sec = ev.sec; items[ev.id].pos = ++posSeq; } break;
    case "del": if(items[ev.id]) items[ev.id].gone = true; break;
  }
}
async function send(ev){
  apply(ev); paint(); saveLocal();
  try{
    const r = await fetch(BASE, {method:"POST", body: JSON.stringify(ev)});
    if(!r.ok) throw new Error(r.status);
  }catch(e){ setStatus("ما انحفظ، جرّب مرة ثانية", false); }
}

/* ---------- render ---------- */
const list = document.getElementById("list");
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let prevOn = {};
function liveItems(k){
  return Object.entries(items).filter(([id,it])=>it.sec===k && !it.gone).sort((a,b)=>a[1].pos-b[1].pos);
}
function paint(){
  const scroll = window.scrollY;
  list.innerHTML = "";
  let total=0, done=0;
  order.forEach(k=>{
    const sec = sections[k]; if(!sec) return;
    const its = liveItems(k);
    const d = its.filter(([id])=>checks[id]?.done).length;
    total += its.length; done += d;
    const who = claims[k]?.name, sn = secNotes[k]?.note;
    const s = document.createElement("section");
    s.classList.toggle("all-done", its.length>0 && d===its.length);
    s.innerHTML = `<div class="sh"><h2>${esc(sec.t)}</h2><span class="sc">${d?`${d}/${its.length}`:its.length}</span>
      <button class="claim${who?" taken":""}" type="button">${who?"👤 "+esc(who):"أنا أجيب القسم"}</button>
      <button class="more" type="button" aria-label="خيارات القسم">⋯</button></div>
      ${sn?`<div class="where">📍 ${esc(sn)}</div>`:""}<ul></ul>
      <button class="additem" type="button">+ غرض جديد</button>`;
    s.querySelector(".claim").onclick = ()=>toggleClaim(k);
    s.querySelector(".more").onclick = ()=>editSection(k);
    s.querySelector(".where")?.addEventListener("click", ()=>editSection(k));
    s.querySelector(".additem").onclick = ()=>addItem(k);
    const ul = s.querySelector("ul");
    its.forEach(([id,it])=>{
      const c = checks[id], on = !!(c && c.done);
      const own = itemClaims[id]?.name, nv = notes[id]?.note;
      const li = document.createElement("li");
      li.classList.toggle("on", on);
      if(id in prevOn && prevOn[id] !== on) li.classList.add("pulse");
      prevOn[id] = on;
      li.innerHTML = `<label><input type="checkbox"${on?" checked":""}><span class="txt"><span class="name">${esc(it.n)}</span>${it.s?'<span class="star" title="لوجبات العشاء">★</span>':''}${it.d?`<span class="note">${esc(it.d)}</span>`:''}${it.f?`<span class="flag">${esc(it.f)}</span>`:''}${it.by?`<span class="note">أضافته ${esc(it.by)}</span>`:''}<span class="by">${on&&c.by?"✓ انشال: "+esc(c.by):""}</span></span></label>
        <div class="acts"><button type="button" class="chip who${own?" taken":who?" inherit":""}">${own?"👤 "+esc(own):who?"👤 "+esc(who)+" (القسم)":"أنا أجيبه"}</button><button type="button" class="chip nt${nv?" hasnote":""}">${nv?"📝 "+esc(nv)+(notes[id].by?" — "+esc(notes[id].by):""):"+ ملاحظة"}</button><button type="button" class="chip mv">نقل / تعديل</button></div>`;
      const cb = li.querySelector("input");
      cb.onchange = ()=>send({t:"c", id, d: cb.checked?1:0, by: cb.checked?myName:""});
      li.querySelector(".who").onclick = ()=>toggleItemClaim(id);
      li.querySelector(".nt").onclick = ()=>editNote(id);
      li.querySelector(".mv").onclick = ()=>editItem(id);
      ul.appendChild(li);
    });
    list.appendChild(s);
  });
  document.getElementById("total").textContent = total;
  document.getElementById("left").textContent = total-done;
  document.getElementById("prog").style.width = total ? (done/total*100) + "%" : "0";
  document.body.classList.toggle("complete", total>0 && total===done);
  document.getElementById("meBtn").textContent = myName ? "👤 " + myName : "اكتبي اسمك";
  window.scrollTo(0, scroll);
}

/* ---------- actions ---------- */
async function needName(){ if(!myName) await askName(); return !!myName; }
async function toggleClaim(k){
  if(!await needName()) return;
  const cur = claims[k]?.name;
  if(cur && cur !== myName && !confirm(`${cur} ماخذة هالقسم. تبين تاخذينه بدالها؟`)) return;
  send({t:"a", k, name: cur === myName ? "" : myName});
}
async function toggleItemClaim(id){
  if(!await needName()) return;
  const cur = itemClaims[id]?.name;
  if(cur && cur !== myName && !confirm(`${cur} بتجيب هالغرض. تبين تاخذينه بدالها؟`)) return;
  send({t:"i", id, name: cur === myName ? "" : myName});
}
function openDlg(d){ if(d.showModal) d.showModal(); else d.setAttribute("open",""); }
function closeDlg(d){ if(d.close) d.close(); else d.removeAttribute("open"); }

const noteDlg = document.getElementById("noteDlg"), noteIn = document.getElementById("noteIn");
function editNote(id){
  document.getElementById("noteTitle").textContent = "ملاحظة: " + items[id].n;
  noteIn.value = notes[id]?.note || "";
  const save = v=>{ v = v.trim().slice(0,60); closeDlg(noteDlg); send({t:"n", id, note: v, by: v ? myName : ""}); };
  noteDlg.querySelectorAll(".presets button").forEach(b=> b.onclick = ()=>save(b.textContent));
  document.getElementById("noteOk").onclick = ()=>save(noteIn.value);
  document.getElementById("noteClear").onclick = ()=>save("");
  document.getElementById("noteCancel").onclick = ()=>closeDlg(noteDlg);
  openDlg(noteDlg);
}

const itemDlg = document.getElementById("itemDlg"), itemName = document.getElementById("itemName"), itemSec = document.getElementById("itemSec");
function fillSecSelect(sel){
  itemSec.innerHTML = order.filter(k=>sections[k]).map(k=>`<option value="${esc(k)}"${k===sel?" selected":""}>${esc(sections[k].t)}</option>`).join("");
}
function editItem(id){
  const it = items[id];
  document.getElementById("itemTitle").textContent = "تعديل أو نقل غرض";
  itemName.value = it.n; fillSecSelect(it.sec);
  const del = document.getElementById("itemDel"); del.hidden = false;
  document.getElementById("itemOk").onclick = ()=>{
    const n = itemName.value.trim().slice(0,40), sec = itemSec.value;
    closeDlg(itemDlg);
    if(n && n !== it.n) send({t:"itemr", id, n});
    if(sec !== it.sec) send({t:"mv", id, sec});
  };
  del.onclick = ()=>{ if(confirm(`تحذف «${it.n}» من القائمة؟`)){ closeDlg(itemDlg); send({t:"del", id}); } };
  document.getElementById("itemCancel").onclick = ()=>closeDlg(itemDlg);
  openDlg(itemDlg); setTimeout(()=>itemName.focus(), 50);
}
function addItem(k){
  document.getElementById("itemTitle").textContent = "غرض جديد";
  itemName.value = ""; fillSecSelect(k);
  document.getElementById("itemDel").hidden = true;
  document.getElementById("itemOk").onclick = ()=>{
    const n = itemName.value.trim().slice(0,40);
    if(!n){ itemName.focus(); return; }
    closeDlg(itemDlg);
    send({t:"item+", id: newId("x"), sec: itemSec.value, n, by: myName});
  };
  document.getElementById("itemCancel").onclick = ()=>closeDlg(itemDlg);
  openDlg(itemDlg); setTimeout(()=>itemName.focus(), 50);
}

const secDlg = document.getElementById("secDlg"), secName = document.getElementById("secName"), secNote = document.getElementById("secNote");
function moveSec(k, dir){
  const o = order.filter(x=>sections[x]); const i = o.indexOf(k), j = i + dir;
  if(i<0 || j<0 || j>=o.length) return;
  [o[i], o[j]] = [o[j], o[i]];
  send({t:"ord", order: o});
}
function editSection(k){
  const isNew = !k;
  document.getElementById("secTitle").textContent = isNew ? "قسم جديد" : "تعديل القسم";
  secName.value = isNew ? "" : sections[k].t;
  secNote.value = isNew ? "" : (secNotes[k]?.note || "");
  document.getElementById("secMoveRow").hidden = isNew;
  document.getElementById("secUp").onclick = ()=>moveSec(k, -1);
  document.getElementById("secDown").onclick = ()=>moveSec(k, 1);
  document.getElementById("secOk").onclick = ()=>{
    const t = secName.value.trim().slice(0,30), n = secNote.value.trim().slice(0,60);
    if(!t){ secName.focus(); return; }
    closeDlg(secDlg);
    let key = k;
    if(isNew){ key = newId("s"); send({t:"sec+", k: key, title: t}); }
    else if(t !== sections[k].t) send({t:"secr", k, title: t});
    if(n !== (secNotes[key]?.note || "")) send({t:"sn", k: key, note: n, by: n ? myName : ""});
  };
  document.getElementById("secCancel").onclick = ()=>closeDlg(secDlg);
  openDlg(secDlg); if(isNew) setTimeout(()=>secName.focus(), 50);
}
document.getElementById("addSecBtn").onclick = ()=>editSection(null);

/* ---------- name ---------- */
const nameDlg = document.getElementById("nameDlg"), nameIn = document.getElementById("nameIn");
function askName(){
  return new Promise(res=>{
    nameIn.value = myName;
    document.getElementById("nameOk").onclick = ()=>{
      myName = nameIn.value.trim().slice(0,20);
      try{ localStorage.setItem("jamiya-name", myName); }catch(e){}
      closeDlg(nameDlg); paint(); res();
    };
    document.getElementById("nameCancel").onclick = ()=>{ closeDlg(nameDlg); res(); };
    openDlg(nameDlg); setTimeout(()=>nameIn.focus(), 50);
  });
}
document.getElementById("meBtn").onclick = askName;

/* ---------- hide done ---------- */
const hideBtn = document.getElementById("hideBtn");
function setHide(v){ document.body.classList.toggle("hide", v); hideBtn.setAttribute("aria-pressed", v); try{localStorage.setItem("jamiya-hide", v?"1":"");}catch(e){} }
let h=false; try{ h = localStorage.getItem("jamiya-hide")==="1"; }catch(e){}
setHide(h);
hideBtn.onclick = ()=>setHide(!document.body.classList.contains("hide"));

/* ---------- local cache ---------- */
function saveLocal(){ try{ localStorage.setItem(LOCAL, JSON.stringify({sections, items, order, checks, claims, itemClaims, notes, secNotes, posSeq})); }catch(e){} }
function loadLocal(){
  try{
    const o = JSON.parse(localStorage.getItem(LOCAL)||"null"); if(!o) return;
    ({sections, items, order, checks, claims, itemClaims, notes, secNotes} = o);
    posSeq = o.posSeq || posSeq;
  }catch(e){ resetState(); }
}

/* ---------- status ---------- */
const statusEl = document.getElementById("status");
function setStatus(t, live){ statusEl.textContent = t; statusEl.classList.toggle("live", !!live); }

/* ---------- live sync: replay all events, then stream ---------- */
loadLocal(); paint();
let es, lastEventAt = 0, firstConnect = true;
function connect(){
  if(es) es.close();
  const since = firstConnect ? "all" : (lastEventAt || "all");
  let pendingReset = firstConnect;    // first message rebuilds from the full history
  firstConnect = false;
  es = new EventSource(BASE + "/sse?since=" + since);
  es.onopen = ()=> setStatus("متصل ومباشر", true);
  es.onmessage = m=>{
    let n; try{ n = JSON.parse(m.data); }catch(e){ return; }
    if(n.event !== "message") return;
    lastEventAt = Math.max(lastEventAt, n.time||0);
    let ev; try{ ev = JSON.parse(n.message); }catch(e){ return; }
    if(pendingReset){ resetState(); pendingReset = false; }
    apply(ev); schedulePaint();
  };
  es.onerror = ()=> setStatus("يعيد الاتصال…", false);
}
let paintQueued = false;
function schedulePaint(){ if(paintQueued) return; paintQueued = true; requestAnimationFrame(()=>{ paintQueued = false; paint(); saveLocal(); }); }
connect();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && (!es || es.readyState===2)) connect(); });
</script>
</body>
</html>
